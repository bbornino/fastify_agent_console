services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_console
      POSTGRES_PASSWORD: agent_console_dev
      POSTGRES_DB: agent_console
    ports:
      - "5439:5432"
    volumes:
      - agent_console_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - agent_console_redisdata:/data

volumes:
  agent_console_pgdata:
  agent_console_redisdata: