services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_console
      POSTGRES_PASSWORD: agent_console_dev
      POSTGRES_DB: agent_console
    ports:
      - "5439:5432"
    volumes:
      - agent_console_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - agent_console_redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: agent_console
      MINIO_ROOT_PASSWORD: agent_console_dev
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - agent_console_miniodata:/data
    command: server /data --console-address ":9001"
  
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  agent_console_pgdata:
  agent_console_redisdata:
  agent_console_miniodata: